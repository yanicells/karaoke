name: KaraokeMic
options:
  bundleIdPrefix: com.karaokemic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Core:
    path: .

targets:
  KaraokeMic:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: Core
        product: KaraokeMicCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karaokemic.KaraokeMic
        PRODUCT_NAME: KaraokeMic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Generate Info.plist from build settings; declare mic usage for TCC.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "KaraokeMic needs microphone access to route your voice to the speaker."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        # Non-sandboxed: creating a private CoreAudio aggregate device is not
        # permitted under the App Sandbox. Local/personal app, so this is fine.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Ad-hoc sign so it builds and runs locally without a developer team.
        # Open the project in Xcode and switch to Automatic signing to use yours.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
