[package]
name = "karaoke-mic"
version = "0.2.0"
edition = "2024"
description = "A minimal, low-latency macOS microphone monitor built with Rust and GPUI"
repository = "https://github.com/yanicells/karaoke"
publish = false

[[bin]]
name = "KaraokeMic"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
async-channel = "2.5"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
